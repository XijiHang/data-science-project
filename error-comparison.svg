  </g>
  <g id="text_22">
   <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #192a2a" x="38.592" y="29.376" transform="rotate(-0 38.592 29.376)">Lower average error, larger errors on high days</text>
  </g>
  <g id="text_23">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #64716f" x="38.592" y="55.08" transform="rotate(-0 38.592 55.08)">Lower is better. Both panels use the same scale.</text>
  </g>
  <g id="text_24">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #192a2a" x="38.592" y="328.644" transform="rotate(-0 38.592 328.644)">4,920 test station-days · 459 high cases · Cutoff: training P90 = 168.4 µg/m³</text>
  </g>
